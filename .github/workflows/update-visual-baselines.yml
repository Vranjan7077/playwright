name: Update Visual Baselines

on:
  schedule:
    # Nightly, after the full regression run at 03:17 UTC.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Override BASE_URL (e.g. a deploy-preview URL)'
        required: false
        default: ''

env:
  BASE_URL: ${{ github.event.inputs.base_url || 'https://vranjan.dev' }}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-snapshots:
    name: Regenerate visual baselines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install browsers
        run: npx playwright install --with-deps chromium
      - name: Update snapshots against production
        run: npx playwright test tests/visual --project=visual-chromium --update-snapshots
        env:
          CI: true
      - name: Open PR if baselines changed
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'Update visual baselines for production content changes'
          title: 'Update visual regression baselines'
          body: |
            Auto-generated by the nightly [Update Visual Baselines](../actions/workflows/update-visual-baselines.yml) workflow.

            Production content shifted enough to change one or more visual regression
            screenshots. Review the image diffs in the "Files changed" tab before merging -
            this could be an intentional content update, or a real visual regression.

            This PR was opened with the default `GITHUB_TOKEN`, so it will **not**
            automatically trigger the PR fast-path CI check.
          branch: auto/update-visual-baselines
          add-paths: tests/visual/**/*.png
          delete-branch: true
