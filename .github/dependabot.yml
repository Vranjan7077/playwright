version: 2
updates:
  # Playwright, axe-core, TypeScript, ESLint/Prettier, etc.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      playwright:
        patterns:
          - '@playwright/*'
          - 'playwright'
          - '@axe-core/*'
      lint-and-format:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'prettier*'

  # Keep the actions used in playwright.yml (checkout, setup-node, cache,
  # upload/download-artifact) current - these matter for CI security too.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
